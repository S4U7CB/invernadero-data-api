<svg viewBox="0 0 1020 460" xmlns="http://www.w3.org/2000/svg" font-family="Arial, Helvetica, sans-serif">
  <rect x="0" y="0" width="1020" height="460" fill="#ffffff"/>
  <defs>
    <marker id="ar" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#1f7a4d"/>
    </marker>
    <marker id="arb" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 z" fill="#5a6b64"/>
    </marker>
  </defs>

  <text x="510" y="34" text-anchor="middle" fill="#1e4a2e" font-size="17" font-weight="bold">API REST (FastAPI) — Flujo de Big Data</text>

  <!-- Modelos de ML (arriba, alimenta al procesamiento) -->
  <rect x="430" y="58" width="250" height="66" rx="9" fill="#e8f5ee" stroke="#1f7a4d" stroke-width="2"/>
  <text x="555" y="80" text-anchor="middle" fill="#1f7a4d" font-size="12.5" font-weight="bold">Modelos de Machine Learning</text>
  <text x="555" y="99" text-anchor="middle" fill="#3a4a43" font-size="10.5">Random Forest · Gradient Boosting</text>
  <text x="555" y="114" text-anchor="middle" fill="#3a4a43" font-size="10.5">Isolation Forest</text>

  <!-- Fila del pipeline -->
  <!-- Cliente -->
  <rect x="30" y="170" width="130" height="90" rx="10" fill="#ffffff" stroke="#5a6b64" stroke-width="1.6"/>
  <text x="95" y="205" text-anchor="middle" fill="#2b3a34" font-size="13.5" font-weight="bold">Cliente</text>
  <text x="95" y="226" text-anchor="middle" fill="#5a6b64" font-size="10.5">envía datos /</text>
  <text x="95" y="240" text-anchor="middle" fill="#5a6b64" font-size="10.5">consulta resultados</text>

  <!-- 1 Ingestión -->
  <rect x="210" y="160" width="190" height="110" rx="10" fill="#ffffff" stroke="#1f7a4d" stroke-width="1.8"/>
  <text x="305" y="186" text-anchor="middle" fill="#1f7a4d" font-size="13" font-weight="bold">1. Ingestión</text>
  <text x="305" y="206" text-anchor="middle" fill="#2b3a34" font-size="10.8" font-family="Courier New, monospace">POST /api/data/ingest</text>
  <text x="305" y="226" text-anchor="middle" fill="#5a6b64" font-size="10.5">recepción de datos</text>
  <text x="305" y="241" text-anchor="middle" fill="#5a6b64" font-size="10.5">(JSON / CSV)</text>
  <text x="305" y="256" text-anchor="middle" fill="#5a6b64" font-size="10.5">+ validación</text>

  <!-- 2 Procesamiento -->
  <rect x="450" y="160" width="210" height="110" rx="10" fill="#ffffff" stroke="#1f7a4d" stroke-width="1.8"/>
  <text x="555" y="186" text-anchor="middle" fill="#1f7a4d" font-size="13" font-weight="bold">2. Procesamiento</text>
  <text x="555" y="206" text-anchor="middle" fill="#2b3a34" font-size="10.8" font-family="Courier New, monospace">POST /api/data/process</text>
  <text x="555" y="226" text-anchor="middle" fill="#5a6b64" font-size="10.5">limpieza · transformación</text>
  <text x="555" y="241" text-anchor="middle" fill="#5a6b64" font-size="10.5">(ETL) · agregación</text>
  <text x="555" y="256" text-anchor="middle" fill="#5a6b64" font-size="10.5">+ cálculo de métricas</text>

  <!-- 3 Consulta -->
  <rect x="710" y="160" width="180" height="110" rx="10" fill="#ffffff" stroke="#1f7a4d" stroke-width="1.8"/>
  <text x="800" y="186" text-anchor="middle" fill="#1f7a4d" font-size="13" font-weight="bold">3. Consulta</text>
  <text x="800" y="206" text-anchor="middle" fill="#2b3a34" font-size="10.5" font-family="Courier New, monospace">GET /api/data/results</text>
  <text x="800" y="228" text-anchor="middle" fill="#5a6b64" font-size="10.5">resultados procesados</text>
  <text x="800" y="243" text-anchor="middle" fill="#5a6b64" font-size="10.5">y visualización</text>

  <!-- Base de datos -->
  <rect x="210" y="330" width="680" height="64" rx="9" fill="#f1f7f4" stroke="#bcdccd" stroke-width="2"/>
  <text x="550" y="358" text-anchor="middle" fill="#1f7a4d" font-size="13" font-weight="bold">Base de datos (SQLite)</text>
  <text x="550" y="378" text-anchor="middle" fill="#5a6b64" font-size="10.5">tablas: lecturas · resultados</text>

  <!-- Flechas pipeline -->
  <line x1="160" y1="215" x2="208" y2="215" stroke="#1f7a4d" stroke-width="2.2" marker-end="url(#ar)"/>
  <line x1="400" y1="215" x2="448" y2="215" stroke="#1f7a4d" stroke-width="2.2" marker-end="url(#ar)"/>
  <line x1="660" y1="215" x2="708" y2="215" stroke="#1f7a4d" stroke-width="2.2" marker-end="url(#ar)"/>

  <!-- ML -> Procesamiento -->
  <line x1="555" y1="124" x2="555" y2="158" stroke="#1f7a4d" stroke-width="2.2" marker-end="url(#ar)"/>

  <!-- Pipeline <-> BD -->
  <line x1="305" y1="270" x2="305" y2="328" stroke="#5a6b64" stroke-width="1.6" marker-end="url(#arb)"/>
  <line x1="555" y1="270" x2="555" y2="328" stroke="#5a6b64" stroke-width="1.6" marker-end="url(#arb)"/>
  <line x1="800" y1="328" x2="800" y2="272" stroke="#5a6b64" stroke-width="1.6" marker-end="url(#arb)"/>

  <text x="510" y="430" text-anchor="middle" fill="#5a6b64" font-size="12">Flujo: el cliente envía datos → se validan y almacenan → se procesan (ETL + ML) → se consultan los resultados</text>
</svg>
